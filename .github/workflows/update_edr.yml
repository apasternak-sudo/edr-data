name: Update EDR Data Registry

on:
  schedule:
    - cron: '0 3 * * 1' # Запуск щопонеділка о 3:00 ночі
  workflow_dispatch:     # Можливість ручного запуску

permissions:
  contents: write
  pages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Очищення дискового простору на Runner
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      # Запуск нашого скрипту convert.py
      - name: Run Converter (Download, Extract, Clean and Chunk)
        run: python convert.py

      # Публікація готової папки edr_chunks у гілку gh-pages
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./edr_chunks
          destination_dir: edr_chunks
