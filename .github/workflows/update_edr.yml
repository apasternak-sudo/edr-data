name: Update EDR Data Registry

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests ftfy

      - name: Download, Fix Encoding & Split Registry
        run: |
          python -c "
          import requests, json, os, re, html
          import ftfy

          def fix_text(text):
              if not text: return ''
              s = str(text)
              # 1. Виправляємо бите кодування (Mojibake / CP1251)
              s = ftfy.fix_text(s)
              s = html.unescape(s)
              # 2. Замінюємо спецартефакти Мін'юсту (22Т -> «, і т.д.)
              s = re.sub(r'22[ТT]|18[ТT]', '«', s)
              s = re.sub(r'[\x00-\x1F\x7F-\x9F]', '', s) # Прибираємо недруковані символи
              s = re.sub(r'\s+', ' ', s).strip()
              return s

          def parse_reg(raw_reg):
              if not raw_reg: return '', ''
              # Прибираємо дублікати дат '22.07.2026; 22.07.2026; 101088...'
              parts = [p.trim() for p in str(raw_reg).split(';') if p.strip()]
              unique_parts = []
              for p in parts:
                  if p not in unique_parts: unique_parts.append(p)
              
              date = unique_parts[0] if len(unique_parts) > 0 else ''
              num = unique_parts[-1] if len(unique_parts) > 1 else ''
              return date, num

          url = 'https://github.com/apasternak-sudo/edr-data/releases/download/v1.0.0/edr_registry.ndjson'
          print('Downloading and cleaning registry...')
          
          response = requests.get(url, stream=True)
          os.makedirs('edr_chunks', exist_ok=True)
          
          files = {}
          count = 0

          for line in response.iter_lines():
              if not line: continue
              try:
                  line_str = line.decode('utf-8', errors='ignore')
                  rec = json.loads(line_str)
                  eid = str(rec.get('id', '')).strip()
                  if not eid: continue

                  reg_date, reg_num = parse_reg(rec.get('registration', ''))

                  clean_rec = {
                      'id': eid,
                      'name': fix_text(rec.get('name', '')),
                      'short_name': fix_text(rec.get('short_name', '')),
                      'status': fix_text(rec.get('status', '')) or 'Зареєстровано',
                      'registration_date': reg_date,
                      'registration_number': reg_num,
                      'founders': [fix_text(f) for f in rec.get('founders', []) if fix_text(f)],
                      'signers': [fix_text(s) for s in rec.get('signers', []) if fix_text(s)],
                      'tax_data': rec.get('tax_data', [])
                  }
                  
                  prefix = eid[:3] if len(eid) >= 3 else 'other'
                  if prefix not in files:
                      files[prefix] = open(f'edr_chunks/{prefix}.json', 'w', encoding='utf-8')
                  
                  files[prefix].write(json.dumps(clean_rec, ensure_ascii=False) + '\n')
                  count += 1
              except Exception as e:
                  pass

          for fp in files.values():
              fp.close()

          print(f'Done! Processed {count} records.')
          "

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./edr_chunks
          destination_dir: edr_chunks
