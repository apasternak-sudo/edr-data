name: Update EDR Data Registry

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Download & Clean Registry Data
        run: |
          python -c "
          import requests, json, os, html, re

          def clean_text(text):
              if not text: return ''
              # 1. Unescape HTML entities (&quot;, &#220;, etc.)
              s = html.unescape(str(text))
              # 2. Fix specific EDR artifacts (like '22T', '18T', '22&#1058;')
              s = re.sub(r'22[ТT]|18[ТT]', '«', s)
              s = re.sub(r'&quot;|\&quot;', '\"', s)
              s = re.sub(r'\s+', ' ', s).strip()
              return s

          url = 'https://github.com/apasternak-sudo/edr-data/releases/download/v1.0.0/edr_registry.ndjson'
          print('Downloading registry...')
          
          response = requests.get(url, stream=True)
          os.makedirs('edr_chunks', exist_ok=True)
          
          files = {}
          count = 0

          for line in response.iter_lines():
              if not line: continue
              try:
                  line_str = line.decode('utf-8')
                  rec = json.loads(line_str)
                  eid = str(rec.get('id', '')).strip()
                  if not eid: continue

                  # Clean entity fields
                  rec['name'] = clean_text(rec.get('name', ''))
                  rec['short_name'] = clean_text(rec.get('short_name', ''))
                  rec['status'] = clean_text(rec.get('status', ''))
                  if 'founders' in rec and isinstance(rec['founders'], list):
                      rec['founders'] = [clean_text(f) for f in rec['founders']]
                  if 'signers' in rec and isinstance(rec['signers'], list):
                      rec['signers'] = [clean_text(s) for s in rec['signers']]
                  
                  prefix = eid[:3] if len(eid) >= 3 else 'other'
                  if prefix not in files:
                      files[prefix] = open(f'edr_chunks/{prefix}.json', 'w', encoding='utf-8')
                  
                  files[prefix].write(json.dumps(rec, ensure_ascii=False) + '\n')
                  count += 1
              except Exception as e:
                  pass

          for fp in files.values():
              fp.close()

          print(f'Done! Processed {count} records into clean chunks.')
          "

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./edr_chunks
          destination_dir: edr_chunks
