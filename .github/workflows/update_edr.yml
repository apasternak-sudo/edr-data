name: Update EDR Data Registry

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Download & Clean Encoding & Split Registry
        run: |
          python -c "
          import requests, json, os, re, html

          def clean_text(raw):
              if not raw: return ''
              s = str(raw)
              
              # 1. Спроба відновлення битого CP1251 (Mojibake)
              try:
                  s = s.encode('raw_unicode_escape').decode('cp1251')
              except Exception:
                  pass

              # 2. Заміна спец-артефактів Мін'юсту
              s = re.sub(r'22[ТT]|18[ТT]', '«', s)
              s = html.unescape(s)
              
              # 3. Прибираємо невидимі та керуючі символи
              s = re.sub(r'[\x00-\x1F\x7F-\x9F]', '', s)
              s = re.sub(r'\s+', ' ', s).strip()
              return s

          def parse_reg(raw):
              if not raw: return '', ''
              parts = [p.strip() for p in str(raw).split(';') if p.strip()]
              date = parts[0] if parts else ''
              num = parts[-1] if len(parts) > 1 else ''
              return date, num

          url = 'https://github.com/apasternak-sudo/edr-data/releases/download/v1.0.0/edr_registry.ndjson'
          print('Downloading and fixing encoding...')
          
          response = requests.get(url, stream=True)
          os.makedirs('edr_chunks', exist_ok=True)
          
          files = {}
          count = 0

          for line in response.iter_lines():
              if not line: continue
              try:
                  line_str = line.decode('utf-8', errors='ignore')
                  rec = json.loads(line_str)
                  eid = str(rec.get('id', '')).strip()
                  if not eid: continue

                  reg_date, reg_num = parse_reg(rec.get('registration', ''))

                  clean_rec = {
                      'id': eid,
                      'name': clean_text(rec.get('name', '')),
                      'short_name': clean_text(rec.get('short_name', '')),
                      'status': clean_text(rec.get('status', '')) or 'Зареєстровано',
                      'registration_date': reg_date,
                      'registration_number': reg_num,
                      'founders': [clean_text(f) for f in rec.get('founders', []) if clean_text(f)],
                      'signers': [clean_text(s) for s in rec.get('signers', []) if clean_text(s)],
                      'tax_data': rec.get('tax_data', [])
                  }
                  
                  prefix = eid[:3] if len(eid) >= 3 else 'other'
                  if prefix not in files:
                      files[prefix] = open(f'edr_chunks/{prefix}.json', 'w', encoding='utf-8')
                  
                  files[prefix].write(json.dumps(clean_rec, ensure_ascii=False) + '\n')
                  count += 1
              except Exception as e:
                  pass

          for fp in files.values():
              fp.close()

          print(f'Done! Successfully cleaned and split {count} records.')
          "

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./edr_chunks
          destination_dir: edr_chunks
