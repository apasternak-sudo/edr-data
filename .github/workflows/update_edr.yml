name: Update EDR Data Registry

on:
  schedule:
    - cron: '0 3 * * 1' # Автозапуск щопонеділка о 03:00
  workflow_dispatch: # Кнопка для ручного запуску у будь-який момент

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Process Registry Data
        run: |
          python convert.py

      - name: Commit & Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add edr_registry.ndjson
          git commit -m "Auto-update EDR data" || exit 0
          git push
